name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
  schedule:
    # Third-party image URLs are audited independently from deploys, so a
    # provider outage is visible without making an unrelated content publish
    # wait for hundreds of remote requests.
    - cron: "20 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      MEDIA_HOST_TIMEOUT_MS: 30000
      MEDIA_HOST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and audit DB-authoritative projection
        run: npm run build
      - name: Check representative external image hosts
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if npm run audit:media-hosts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Representative media-host audit failed on attempt $attempt; retrying..."
              sleep 20
            fi
          done
          echo "Representative media-host audit could not reach one or more third-party hosts; keeping the report and continuing the site deploy."
          exit 1
      - name: Upload media host audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-host-audit-${{ github.run_id }}
          path: media-host-audit.json
      - name: Remove accidental root redirect artifact
        run: rm -f public/.html
      - name: Save public build audit
        run: python3 scripts/audit_public_build.py --public public --content . --fail --status-json public-build-audit.json
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  media-health:
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check every external DB-exported image URL
        run: npm run audit:media-hosts -- --full
      - name: Upload full media health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-media-host-audit-${{ github.run_id }}
          path: media-host-audit.json
